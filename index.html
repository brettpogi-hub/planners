<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aeshabel's Planner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <svg viewBox="0 0 100 130" aria-hidden="true">
    <path d="M50 70 C48 95 52 110 50 128" stroke="var(--leaf)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M50 108 C34 104 26 94 22 84 C38 86 48 94 50 108Z" fill="var(--leaf)"/>
    <g transform="translate(50 42)" fill="var(--accent)">
      <g id="ring"><ellipse cy="-24" rx="11" ry="16" transform="rotate(0)" opacity=".55"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(45)" opacity=".55"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(90)" opacity=".55"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(135)" opacity=".55"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(180)" opacity=".55"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(225)" opacity=".55"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(270)" opacity=".55"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(315)" opacity=".55"/></g>
      <g transform="rotate(22) scale(.72)"><ellipse cy="-24" rx="11" ry="16" transform="rotate(0)" opacity=".8"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(60)" opacity=".8"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(120)" opacity=".8"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(180)" opacity=".8"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(240)" opacity=".8"/><ellipse cy="-24" rx="11" ry="16" transform="rotate(300)" opacity=".8"/></g>
      <circle r="8" opacity=".95"/>
    </g>
  </svg>
  <div>
    <h1 class="title" id="title" contenteditable="true" spellcheck="false" aria-label="Planner title, click to rename">My Carnation Planner</h1>
    <p class="sub">Click the title to rename it. Everything saves on this device.</p>
  </div>
  <div class="themes" id="themes" role="group" aria-label="Carnation colour"></div>
</header>

<main>
  <section aria-labelledby="sch">
    <h2 id="sch">Schedule</h2>
    <div class="days" id="days" role="group" aria-label="Day of the week"></div>
    <form id="evForm">
      <input type="time" id="evTime" aria-label="Time" required>
      <input type="text" id="evText" placeholder="Add something to this day" aria-label="Event" maxlength="80" required>
      <button class="add" type="submit">Add event</button>
    </form>
    <ul id="evList"></ul>
  </section>

  <section aria-labelledby="td">
    <h2 id="td">To-do list</h2>
    <div class="bar"><i id="bar"></i></div>
    <p class="count" id="count"></p>
    <form id="tdForm">
      <input type="text" id="tdText" placeholder="Add a task" aria-label="Task" maxlength="100" required>
      <button class="add" type="submit">Add task</button>
    </form>
    <ul id="tdList"></ul>
    <div class="foot"><button class="link" id="clearDone" type="button">Clear finished tasks</button></div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
